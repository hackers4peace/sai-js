name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies (including the pinned CSS fork)
        run: npm ci
      - name: Lint and format check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Build packages
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Build docs site
        run: npm run build -w @janeirodigital/sai-js-docs-website
      - name: Verify id service
        run: npm ci && npm run typecheck && npm test
        working-directory: services/id
      - name: Integration tests
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: 0.21.12
          # No --css override: use the fork installed from package-lock.json.
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  outside-workspace:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: shapetrees
            command: npm test
          - project: services/css
            command: npm ls --depth=0
          - project: services/worker
            command: npm ls --depth=0
          - project: ui/authorization
            command: npm run build
          - project: examples/vuejectron
            command: npm run build:vite
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Verify
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.project }}
