name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies (including the pinned CSS fork)
        run: npm ci
      # services/id, ui/authorization, and examples/vuejectron are not npm
      # workspaces: they carry their own lockfiles. Oxlint's type-aware rules
      # read their types, so without these trees every cross-module import
      # resolves to `any` and the lint step reports false positives (or an
      # invalid-tsconfig error for examples/vuejectron's `types` entries).
      - name: Install project dependencies for type-aware lint
        run: |
          npm ci --prefix services/id
          npm ci --prefix ui/authorization
          npm ci --prefix examples/vuejectron
      - name: Lint and format check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Build packages
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Build docs site
        run: npm run build -w @janeirodigital/sai-js-docs-website
      - name: Verify id service
        run: npm run typecheck && npm test
        working-directory: services/id
      - name: Integration tests
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: 0.21.12
          # No --css override: use the fork installed from package-lock.json.
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
      - name: Authorization UI e2e (Playwright)
        id: e2e
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: 0.21.12
          args: playwright
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
      - name: Export Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: 0.21.12
          # --wipe: export merges into an existing host dir by default, so a
          # reused runner would keep old traces/error-context files alongside
          # this run's report
          args: playwright-report export --path=e2e-out --wipe
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-out

  outside-workspace:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: shapetrees
            command: npm test
          - project: services/css
            command: npm ls --depth=0
          - project: services/worker
            command: npm ls --depth=0
          - project: ui/authorization
            command: npm run build
          - project: examples/vuejectron
            command: npm run build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
      # The projects below consume workspace packages through `file:` links whose
      # main/types point at src, so their deps and @types must exist at the root.
      - name: Install root workspace dependencies
        run: npm ci
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Verify
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.project }}
